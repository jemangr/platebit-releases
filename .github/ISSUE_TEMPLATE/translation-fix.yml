name: Translation fix
description: A text in the app that reads wrong or odd in your language
title: "[Translation] "
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Italiano
        - Español
        - Français
        - Deutsch
        - Português
        - Ελληνικά
        - English
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (screen or button)
      placeholder: "e.g. Today → Calories card"
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What it says
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "Settings → About"
